<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>9.5 Combo Sectionals Scouting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F4; --panel:#FFFFFF; --ink:#13212C; --muted:#5B6B78; --line:#D3DCE2;
  --court:#24557F; --court-soft:#DCE7F1; --surround:#3C7457; --ball:#C9DC3C; --ball-ink:#2E3500;
  --bad:#B4432F; --good:#2F7A4F; --warn:#9A6B00;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1820; --panel:#15232E; --ink:#E6EDF2; --muted:#93A4B1; --line:#27394A;
    --court:#6FA3D6; --court-soft:#1B3246; --surround:#6DB38C; --ball:#D6E85A; --ball-ink:#1D2200;
    --bad:#E0735E; --good:#6CC38F; --warn:#E3B54A;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--court);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
header.top h1{font-size:34px;line-height:1;margin:0;font-weight:700}
header.top p{margin:4px 0 0;color:var(--muted)}
.sync{font-size:13px;color:var(--muted)}

.draw{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:18px}
.draw button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;text-align:left}
.draw button .n{font-family:"Barlow Condensed",sans-serif;font-size:13px;color:var(--muted)}
.draw button .t{font-family:"Barlow Condensed",sans-serif;font-size:21px;font-weight:600;line-height:1.1;display:block}
.draw button[aria-current="true"]{background:var(--court);border-color:var(--court);color:#fff}
.draw button[aria-current="true"] .n{color:#fff;opacity:.85}
@media (max-width:620px){.draw{grid-template-columns:repeat(2,minmax(0,1fr))}}

.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;padding:8px 14px;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--surround)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.panel h2{margin:0 0 4px;font-size:24px}
.panel h3{margin:0 0 6px;font-size:19px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.lineup{display:grid;gap:8px}
.slot{display:grid;grid-template-columns:64px 1fr 150px;gap:12px;align-items:center;border-radius:6px;padding:10px 12px;background:var(--court-soft);border-left:6px solid var(--surround)}
.slot .ln{font-family:"Barlow Condensed",sans-serif;font-size:28px;font-weight:700;line-height:1}
.slot .who{font-weight:600}
.slot .who .alt{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.slot .rt{font-size:13px;color:var(--muted)}
.conf{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.conf i{display:block;height:100%;background:var(--ball)}
.conf-l{font-size:12px;color:var(--muted);margin-top:3px}
@media (max-width:620px){.slot{grid-template-columns:48px 1fr}.slot .cf{grid-column:1/-1}}

.vs{display:grid;grid-template-columns:52px 1fr 90px 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.vs:last-child{border-bottom:0}
.vs .ln{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700}
.edge{text-align:center;font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:600;border-radius:4px;padding:2px 0}
.edge.us{background:var(--good);color:#fff}.edge.them{background:var(--bad);color:#fff}.edge.even{background:var(--line)}
@media (max-width:620px){.vs{grid-template-columns:1fr 70px}.vs .ln{grid-column:1/-1}.vs .theirs{grid-column:1/-1}}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:13px}
th[data-k]{cursor:pointer;user-select:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td input.rate{width:58px;text-align:right;background:transparent;border:1px solid transparent;border-radius:4px;padding:2px 4px}
td input.rate:hover,td input.rate:focus{border-color:var(--line);background:var(--bg)}
td input.pnote{width:100%;min-width:160px;background:transparent;border:1px solid transparent;border-radius:4px;padding:2px 4px}
td input.pnote:hover,td input.pnote:focus{border-color:var(--line);background:var(--bg)}
tr.out td{opacity:.45}
.hot{background:var(--ball);color:var(--ball-ink);border-radius:3px;padding:0 4px}
.bad-t{color:var(--bad);font-weight:600}
.warn-t{color:var(--warn);font-weight:600}

input[type=text],input[type=date],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
textarea{width:100%;min-height:130px;resize:vertical;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
textarea.notes{font-family:inherit;font-size:14px;min-height:110px}
.btn{background:var(--court);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.weights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.weights label{display:block;font-size:13px;color:var(--muted)}
.weights input[type=range]{width:100%}
@media (max-width:560px){.weights{grid-template-columns:1fr}}

.editor .ed-line{display:grid;grid-template-columns:44px 1fr 1fr 90px;gap:8px;align-items:center;margin-bottom:6px}
.editor .ed-line .ln{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:700}
@media (max-width:560px){.editor .ed-line{grid-template-columns:36px 1fr 1fr;}.editor .ed-line select.res{grid-column:2/-1}}

.match{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pill{font-size:12px;border-radius:10px;padding:1px 8px;background:var(--court-soft);color:var(--court);font-weight:600}
.pill.sectional{background:var(--ball);color:var(--ball-ink)}
.pill.playoff{background:var(--surround);color:#fff}
.note{border-left:3px solid var(--ball);padding:6px 10px;background:var(--bg);border-radius:0 6px 6px 0;font-size:13px}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.sched{display:grid;gap:6px}
.sched .it{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;padding:8px 10px;background:var(--bg);border-radius:6px}
.sched .when{font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:600}
@media (max-width:560px){.sched .it{grid-template-columns:1fr auto}.sched .when{grid-column:1/-1}}
@media (prefers-reduced-motion:no-preference){.conf i{transition:width .4s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>9.5 Combo · NorCal Sectionals scouting</h1>
      <p>Johnson Ranch, Sacramento · Fri–Sun, Jan 22–24, 2027 · Rain dates Feb 5–7</p>
    </div>
    <div class="sync" id="sync">Connecting…</div>
  </header>

  <nav class="draw" id="draw" aria-label="Teams"></nav>
  <div class="tabs" role="tablist" id="tabs"></div>
  <main id="view"></main>
</div>

<script>
const LINES = ["D1","D2","D3"]; // Combo: three doubles courts
const LEVEL = 9.5, MAX_GAP = 1.0;
const STAGES = {regular:"Regular season", playoff:"Local playoffs", sectional:"Past sectionals"};
const TEAMS = [
  {id:"us", label:"Our team",      n:"Us"},
  {id:"eb", label:"EB",            n:"Fri Jan 22 · 8:30am"},
  {id:"sf", label:"SF",            n:"Fri Jan 22 · 1:30pm"},
  {id:"sa", label:"SA",            n:"Sat Jan 23 · 10:00am"},
];
const OPP = TEAMS.filter(t => t.id !== "us");
// Our six pairs, from the team's lineup note
const OUR_PAIRS = [["Micheal","Bill"],["Darrin","Alex"],["Ashwin","Hanson"],["Cody","Jerry"],["Ken","Sanggyum"],["Ryan","Ben"]];

const slug = s => String(s).toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const newPlayer = name => ({id:slug(name), name:name.trim(), ntrp:null, wtnD:null, utrD:null, out:false, note:""});
function blankTeam(t){
  const b = {name:t.label, teamName:"", players:[], matches:[], plan:{}, notes:"", knownPairs:[], weights:{regular:1,playoff:2,sectional:2}};
  if (t.id === "us"){
    b.players = OUR_PAIRS.flat().map(newPlayer);
    b.knownPairs = OUR_PAIRS.map(p => p.map(slug));
  }
  return b;
}

let db = null, sample = null;
const state = {}; TEAMS.forEach(t => state[t.id] = blankTeam(t));
let current = "eb", tab = "projection", sortKey = "app", sortDir = -1, draft = null;

/* ---------- storage ---------- */
function lsGet(id){ try{ const v = localStorage.getItem("combo95:"+id); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function lsSet(id,v){ try{ localStorage.setItem("combo95:"+id, JSON.stringify(v)); }catch(e){} }
TEAMS.forEach(t => { const v = lsGet(t.id); if (v) state[t.id] = Object.assign(blankTeam(t), v); });

async function save(id){
  const doc = JSON.parse(JSON.stringify(state[id]));
  lsSet(id, doc);
  if (!db) return;
  try { await db.doc("teams/"+id).set(doc); setSync("Saved · shared with your team"); }
  catch(e){ setSync(e.code === "invalid_argument" ? "You can view but not edit this page" : "Couldn't save — changes kept on this device"); }
}
function setSync(t){ document.getElementById("sync").textContent = t; }

(async () => {
  try { db = await window.claude?.use("db"); } catch(e){ db = null; }
  try { sample = await window.claude?.use("sample"); } catch(e){ sample = null; }
  if (!db){ setSync("Saving on this device only"); render(); return; }
  setSync("Live · shared with your team");
  TEAMS.forEach(t => {
    db.doc("teams/"+t.id).onSnapshot(snap => {
      if (snap.exists){ state[t.id] = Object.assign(blankTeam(t), JSON.parse(JSON.stringify(snap.data()))); lsSet(t.id, state[t.id]); }
      if (!isEditing()) render();
    }, () => setSync("Live sync paused — reload to reconnect"));
  });
  render();
})();
function isEditing(){ const a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName); }

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => (v === "" || v == null || isNaN(+v)) ? null : +v;
const fmt = (v,d=1) => v == null ? "—" : (+v).toFixed(d);
function playerById(team, id){ return team.players.find(p => p.id === id); }
function nameOf(team, id){ return playerById(team,id)?.name || id; }
function pairName(team, ids){ return ids.map(i => esc(nameOf(team,i))).join(" / "); }
function ensurePlayer(team, name){
  const id = slug(name); if (!id) return null;
  if (!playerById(team,id)) team.players.push(newPlayer(name));
  return id;
}
function avg(a){ const v = a.filter(x => x != null); return v.length ? v.reduce((s,x)=>s+x,0)/v.length : null; }
function teamLabel(id){ const t = state[id]; return t.teamName ? `${TEAMS.find(x=>x.id===id).label} · ${t.teamName}` : TEAMS.find(x=>x.id===id).label; }

/* Combo legality: combined NTRP ≤ 9.5 and partners within 1.0 of each other */
function combo(team, ids){
  const r = ids.map(i => playerById(team,i)?.ntrp ?? null);
  if (ids.length < 2 || r.some(x => x == null)) return {sum:null, txt:"NTRP —", cls:""};
  const sum = r[0]+r[1], gap = Math.abs(r[0]-r[1]);
  if (sum > LEVEL + 1e-9) return {sum, txt:`NTRP ${sum.toFixed(1)} · over 9.5`, cls:"bad-t", bad:true};
  if (gap > MAX_GAP + 1e-9) return {sum, txt:`NTRP ${r[0].toFixed(1)}+${r[1].toFixed(1)} · gap over 1.0`, cls:"bad-t", bad:true};
  return {sum, txt:`NTRP ${r[0].toFixed(1)}+${r[1].toFixed(1)} = ${sum.toFixed(1)}`, cls: sum < LEVEL ? "warn-t" : ""};
}

/* ---------- the model ---------- */
function analyze(team){
  const w = team.weights, stats = {}, pairs = {}, lineTotals = {};
  LINES.forEach(l => lineTotals[l] = 0);
  let totalW = 0;
  team.players.forEach(p => stats[p.id] = {w:0, lines:Object.fromEntries(LINES.map(l=>[l,0])), won:0, lost:0, matches:0});
  team.matches.forEach(m => {
    const mw = w[m.stage] ?? 1; totalW += mw;
    m.lines.forEach(ln => {
      if (!ln.players?.length || !LINES.includes(ln.line)) return;
      lineTotals[ln.line] += mw;
      ln.players.forEach(pid => {
        const s = stats[pid]; if (!s) return;
        s.w += mw; s.lines[ln.line] += mw; s.matches++;
        if (ln.result === "W") s.won++; else if (ln.result === "L") s.lost++;
      });
      if (ln.players.length === 2){
        const k = [...ln.players].sort().join("|");
        pairs[k] ??= {ids:k.split("|"), lines:{}, w:0, won:0, lost:0, n:0};
        const p = pairs[k];
        p.lines[ln.line] = (p.lines[ln.line]||0) + mw; p.w += mw; p.n++;
        if (ln.result === "W") p.won++; else if (ln.result === "L") p.lost++;
      }
    });
  });
  return {stats, pairs, totalW, lineTotals};
}

function project(team){
  const A = analyze(team);
  const avail = id => { const p = playerById(team,id); return p && !p.out; };
  const cands = [];
  for (const p of Object.values(A.pairs)) if (p.ids.every(avail))
    for (const [l,w] of Object.entries(p.lines)) cands.push({line:l, ids:p.ids, w: w*1.15}); // intact partnerships matter most in Combo
  cands.sort((a,b) => b.w - a.w);
  const used = new Set(), out = {};
  for (const c of cands){
    if (out[c.line] || c.ids.some(i => used.has(i))) continue;
    out[c.line] = {ids:c.ids, w:c.w, kind:"pair"};
    c.ids.forEach(i => used.add(i));
  }
  // a line still open: next-best intact partnership from any line, then build from individuals
  for (const l of LINES) if (!out[l]){
    const p = Object.values(A.pairs).filter(p => p.ids.every(avail) && !p.ids.some(i=>used.has(i))).sort((a,b)=>b.w-a.w)[0];
    if (p){ out[l] = {ids:p.ids, w:p.lines[l]||0, kind:"moved"}; p.ids.forEach(i=>used.add(i)); continue; }
    const pool = Object.entries(A.stats).filter(([id]) => avail(id) && !used.has(id))
      .map(([id,s]) => ({id, w:s.lines[l] + 0.3*s.w})).filter(x=>x.w>0).sort((a,b)=>b.w-a.w).slice(0,2);
    if (pool.length){ out[l] = {ids:pool.map(p=>p.id), w:avg(pool.map(p=>p.w)), kind:"built"}; pool.forEach(p=>used.add(p.id)); }
  }
  LINES.forEach(l => { if (out[l]) out[l].conf = A.lineTotals[l] ? Math.min(1, (out[l].kind==="pair" ? out[l].w/1.15 : out[l].w) / A.lineTotals[l]) : 0; });
  LINES.forEach(l => {
    if (!out[l]) return;
    const key = [...out[l].ids].sort().join("|");
    out[l].alts = Object.entries(A.pairs).filter(([k,p]) => k !== key && p.lines[l] && p.ids.every(avail))
      .sort((a,b)=>b[1].lines[l]-a[1].lines[l]).slice(0,2).map(([,p]) => pairName(team,p.ids));
  });
  return {lineup: out, A};
}

function pairRating(team, ids){
  const ps = ids.map(i => playerById(team,i)).filter(Boolean);
  return { wtn: avg(ps.map(p => p.wtnD)), utr: avg(ps.map(p => p.utrD)) };
}

/* ---------- render ---------- */
function render(){
  const draw = document.getElementById("draw");
  draw.innerHTML = TEAMS.map(t => `<button data-team="${t.id}" aria-current="${t.id===current}"><span class="n">${esc(t.n)}</span><span class="t">${esc(t.id==="us" ? (state.us.teamName||t.label) : t.label)}</span></button>`).join("");
  draw.querySelectorAll("button").forEach(b => b.onclick = () => { current = b.dataset.team; draft = null; render(); });

  const tabs = current === "us"
    ? [["plan","Game plan"],["roster","Our roster & pairs"],["matches","Our matches"],["import","Add data"]]
    : [["projection","Projected lineup"],["matchup","Matchup"],["roster","Roster & pairs"],["matches","Match history"],["import","Add data"]];
  if (!tabs.some(t => t[0]===tab)) tab = tabs[0][0];
  const tb = document.getElementById("tabs");
  tb.innerHTML = tabs.map(([k,l]) => `<button role="tab" aria-selected="${k===tab}" data-tab="${k}">${l}</button>`).join("");
  tb.querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });

  const v = document.getElementById("view");
  const team = state[current];
  ({plan:renderPlan, projection:renderProjection, matchup:renderMatchup, roster:renderRoster, matches:renderMatches, import:renderImport})[tab](v, team);
}

/* Our home view: the weekend at a glance */
function renderPlan(v){
  const us = state.us;
  v.innerHTML = `
  <section class="panel">
    <h2>Sectionals weekend</h2>
    <p class="muted small">Round robin at Johnson Ranch. If it rains out, everything moves to Feb 5–7. Tap a team to see who they're likely to play and set our lineup against them.</p>
    <div class="sched">${OPP.map(t => {
      const team = state[t.id], has = team.matches.length;
      const {lineup} = has ? project(team) : {lineup:{}};
      const plan = us.plan[t.id] || {};
      const set = LINES.filter(l => (plan[l]||[]).filter(Boolean).length === 2).length;
      return `<div class="it"><div class="when">${esc(t.n)}</div>
        <div><b>vs ${esc(teamLabel(t.id))}</b>
          <div class="small muted">${has ? LINES.map(l => lineup[l] ? `${l}: ${pairName(team, lineup[l].ids)}` : `${l}: ?`).join(" · ") : "No scouting data yet"}</div>
          <div class="small muted">Our lineup: ${set}/3 lines set</div></div>
        <button class="btn ghost go" data-t="${t.id}">Open</button></div>`;
    }).join("")}</div>
  </section>
  <section class="panel">
    <h3>Team notes</h3>
    <p class="muted small">Logistics, who's available which day, warm-up courts, anything the team should see.</p>
    <textarea class="notes" id="tnotes" placeholder="e.g. Ken out Saturday morning. Warm-up at 7:45 Friday.">${esc(us.notes)}</textarea>
  </section>`;
  v.querySelectorAll(".go").forEach(b => b.onclick = () => { current = b.dataset.t; tab = state[current].matches.length ? "matchup" : "import"; render(); });
  v.querySelector("#tnotes").onchange = e => { us.notes = e.target.value; save("us"); };
}

function renderProjection(v, team){
  if (!team.matches.length){ v.innerHTML = emptyState(team); bindEmpty(v); return; }
  const {lineup} = project(team);
  const counts = Object.keys(STAGES).map(s => `${team.matches.filter(m=>m.stage===s).length} ${STAGES[s].toLowerCase()}`).join(", ");
  v.innerHTML = `
  <section class="panel">
    <h2>${esc(teamLabel(current))}: most likely lineup</h2>
    <p class="muted small">Built from ${team.matches.length} matches (${counts}). Players marked out for Sectionals are excluded. The bar shows how often this exact pair played that court, weighted by stage.</p>
    <div class="lineup">${LINES.map(l => {
      const s = lineup[l];
      if (!s) return `<div class="slot"><div class="ln">${l}</div><div class="who muted">Not enough history</div><div></div></div>`;
      const r = pairRating(team, s.ids), c = combo(team, s.ids), pct = Math.round((s.conf||0)*100);
      return `<div class="slot">
        <div class="ln">${l}</div>
        <div><div class="who">${pairName(team, s.ids)}
          ${s.alts?.length ? `<span class="alt">Also seen here: ${s.alts.join("; ")}</span>` : ""}
          ${s.kind==="moved" ? `<span class="alt">This pair usually plays a different court</span>` : ""}
          ${s.kind==="built" ? `<span class="alt">Pairing inferred — these two haven't played together</span>` : ""}</div>
          <div class="rt"><span class="${c.cls}">${c.txt}</span> · WTN ${fmt(r.wtn)} · UTR ${fmt(r.utr,2)}</div></div>
        <div class="cf"><div class="conf"><i style="width:${pct}%"></i></div><div class="conf-l">${pct}% of weighted matches</div></div>
      </div>`; }).join("")}</div>
  </section>
  <section class="panel">
    <h3>Scouting notes on ${esc(teamLabel(current))}</h3>
    <textarea class="notes" id="onotes" placeholder="Lefties, who lobs, who poaches, who's coming back from injury…">${esc(team.notes)}</textarea>
  </section>
  <section class="panel">
    <h3>How much each stage counts</h3>
    <p class="muted small">Local playoff lineups are the best preview of how a captain stacks at Sectionals, so they count double by default.</p>
    <div class="weights">${Object.entries(STAGES).map(([k,l]) => `
      <div><label for="w-${k}">${l}: <b id="wv-${k}">${team.weights[k]}×</b></label>
      <input type="range" id="w-${k}" min="0" max="5" step="0.5" value="${team.weights[k]}" data-k="${k}"></div>`).join("")}</div>
  </section>`;
  v.querySelector("#onotes").onchange = e => { team.notes = e.target.value; save(current); };
  v.querySelectorAll("input[type=range]").forEach(r => {
    r.oninput = () => { document.getElementById("wv-"+r.dataset.k).textContent = r.value+"×"; };
    r.onchange = () => { team.weights[r.dataset.k] = +r.value; save(current); render(); };
  });
}

function ourPairs(){
  const us = state.us, A = analyze(us), seen = new Set(), out = [];
  const add = ids => { const k = [...ids].sort().join("|"); if (seen.has(k) || ids.some(i => !playerById(us,i) || playerById(us,i).out)) return; seen.add(k); out.push(ids); };
  (us.knownPairs||[]).forEach(add);
  Object.values(A.pairs).sort((a,b)=>b.w-a.w).forEach(p => add(p.ids));
  return out;
}

function renderMatchup(v, team){
  const us = state.us;
  if (!team.matches.length){ v.innerHTML = emptyState(team); bindEmpty(v); return; }
  const {lineup} = project(team);
  const plan = us.plan[current] ||= {};
  const avail = us.players.filter(p => !p.out);
  const pairs = ourPairs();
  const opts = sel => `<option value="">—</option>` + avail.map(p => `<option value="${p.id}" ${p.id===sel?"selected":""}>${esc(p.name)}</option>`).join("");
  const usedCount = {}; LINES.forEach(l => (plan[l]||[]).filter(Boolean).forEach(i => usedCount[i] = (usedCount[i]||0)+1));
  const dupes = Object.keys(usedCount).filter(i => usedCount[i] > 1);
  v.innerHTML = `
  <section class="panel">
    <h2>Us vs ${esc(teamLabel(current))}</h2>
    <p class="muted small">${esc(TEAMS.find(t=>t.id===current).n)}. Pick a pair for each court on the left — choose one of our pairs from the first menu, or set the two players yourself. The middle column compares doubles WTN (lower is stronger): green favors us, red favors them, within ~1.0 is even.</p>
    ${dupes.length ? `<p class="note bad-t">${dupes.map(i=>esc(nameOf(us,i))).join(", ")} ${dupes.length>1?"are":"is"} on more than one court.</p>` : ""}
    ${LINES.map(l => {
      const ours = plan[l] || [], theirs = lineup[l];
      const oIds = ours.filter(Boolean);
      const oR = pairRating(us, oIds), tR = theirs ? pairRating(team, theirs.ids) : {};
      const oC = combo(us, oIds), tC = theirs ? combo(team, theirs.ids) : null;
      let edge = `<div class="edge even">—</div>`;
      if (oR.wtn != null && tR.wtn != null){
        const d = tR.wtn - oR.wtn;
        edge = `<div class="edge ${Math.abs(d)<1?"even":d>0?"us":"them"}">${d>0?"+":""}${d.toFixed(1)}</div>`;
      }
      const curKey = [...oIds].sort().join("|");
      const quick = `<select class="quick" data-l="${l}" aria-label="${l} pair"><option value="">Pick a pair…</option>${pairs.map(p => { const k=[...p].sort().join("|"); return `<option value="${p.join("|")}" ${k===curKey?"selected":""}>${pairName(us,p)}</option>`; }).join("")}</select>`;
      return `<div class="vs"><div class="ln">${l}</div>
        <div>${quick}<div class="row" style="margin-top:6px"><select data-l="${l}" data-i="0" aria-label="${l} player 1">${opts(ours[0])}</select><select data-l="${l}" data-i="1" aria-label="${l} player 2">${opts(ours[1])}</select></div>
          <div class="small muted"><span class="${oC.cls}">${oC.txt}</span> · WTN ${fmt(oR.wtn)} · UTR ${fmt(oR.utr,2)}</div></div>
        ${edge}
        <div class="theirs"><b>${theirs ? pairName(team, theirs.ids) : "—"}</b>
          <div class="small muted">${tC ? `<span class="${tC.cls}">${tC.txt}</span> · ` : ""}WTN ${fmt(tR.wtn)} · UTR ${fmt(tR.utr,2)}</div>
          ${theirs?.alts?.length ? `<div class="small muted">Or: ${theirs.alts.join("; ")}</div>` : ""}</div></div>`;
    }).join("")}
  </section>`;
  v.querySelectorAll("select.quick").forEach(s => s.onchange = () => { if (!s.value) return; plan[s.dataset.l] = s.value.split("|"); save("us"); render(); });
  v.querySelectorAll("select[data-i]").forEach(s => s.onchange = () => {
    const l = s.dataset.l, i = +s.dataset.i;
    plan[l] = plan[l] || []; plan[l][i] = s.value || null; save("us"); render();
  });
}

function renderRoster(v, team){
  const A = analyze(team);
  const rows = team.players.map(p => {
    const s = A.stats[p.id] || {w:0,lines:{},won:0,lost:0,matches:0};
    return {p, s, app: A.totalW ? s.w/A.totalW : 0};
  });
  const key = {app:r=>r.app, name:r=>r.p.name.toLowerCase(), ntrp:r=>r.p.ntrp ?? 0, wtnD:r=>r.p.wtnD ?? 99, utrD:r=>r.p.utrD ?? 0, rec:r=>r.s.won-r.s.lost};
  rows.sort((a,b) => { const x=key[sortKey](a), y=key[sortKey](b); return (x>y?1:x<y?-1:0)*sortDir; });
  const th = (k,l,c="") => `<th class="${c}" data-k="${k}">${l}${sortKey===k?(sortDir>0?" ▲":" ▼"):""}</th>`;
  const pairList = Object.values(A.pairs).sort((a,b)=>b.w-a.w);
  const isUs = current === "us";
  v.innerHTML = `
  <section class="panel">
    <h2>${esc(teamLabel(current))} roster</h2>
    <p class="muted small">Edit ratings right in the table. NTRP drives the Combo check (pair must add to 9.5 or less, partners within 1.0). Uncheck “At Sectionals” for anyone who isn't making it — ${isUs ? "they drop out of the pair menus" : "the projection reshuffles without them"}.</p>
    ${team.players.length ? `<div class="tbl"><table>
      <thead><tr><th>At Sectionals</th>${th("name","Player")}${th("app","Played","num")}${LINES.map(l=>`<th class="num">${l}</th>`).join("")}${th("rec","W–L","num")}${th("ntrp","NTRP","num")}${th("wtnD","WTN D","num")}${th("utrD","UTR D","num")}<th>Notes</th><th></th></tr></thead>
      <tbody>${rows.map(({p,s,app}) => `<tr class="${p.out?"out":""}">
        <td><input type="checkbox" data-id="${p.id}" class="inout" ${p.out?"":"checked"} aria-label="${esc(p.name)} at Sectionals"></td>
        <td>${esc(p.name)}</td>
        <td class="num">${Math.round(app*100)}%</td>
        ${LINES.map(l => { const sh = s.w ? s.lines[l]/s.w : 0; return `<td class="num">${sh ? `<span class="${sh>=.5?"hot":""}">${Math.round(sh*100)}</span>` : "·"}</td>`; }).join("")}
        <td class="num">${s.won}–${s.lost}</td>
        ${["ntrp","wtnD","utrD"].map(f => `<td class="num"><input class="rate" data-id="${p.id}" data-f="${f}" value="${p[f] ?? ""}" inputmode="decimal" aria-label="${esc(p.name)} ${f}"></td>`).join("")}
        <td><input class="pnote" data-id="${p.id}" value="${esc(p.note)}" placeholder="Lefty, big serve…" aria-label="${esc(p.name)} notes"></td>
        <td><button class="btn danger small del" data-id="${p.id}" aria-label="Remove ${esc(p.name)}">Remove</button></td>
      </tr>`).join("")}</tbody></table></div>` : `<div class="empty">No players yet. Add them under “Add data”.</div>`}
  </section>
  <section class="panel">
    <h3>Partnerships</h3>
    <p class="muted small">Every pair that has played together, most-used first.${isUs ? " Pairs from the team lineup note are listed too." : ""}</p>
    ${(pairList.length || (isUs && team.knownPairs?.length)) ? `<div class="tbl"><table>
      <thead><tr><th>Pair</th><th class="num">Matches</th><th class="num">W–L</th>${LINES.map(l=>`<th class="num">${l}</th>`).join("")}<th>Combo</th></tr></thead>
      <tbody>${(() => {
        const seen = new Set(), list = [];
        pairList.forEach(p => { seen.add([...p.ids].sort().join("|")); list.push(p); });
        if (isUs) (team.knownPairs||[]).forEach(ids => { const k=[...ids].sort().join("|"); if (!seen.has(k)) list.push({ids, lines:{}, w:0, won:0, lost:0, n:0}); });
        return list.map(p => { const c = combo(team,p.ids); return `<tr><td>${pairName(team,p.ids)}</td><td class="num">${p.n}</td><td class="num">${p.won}–${p.lost}</td>
          ${LINES.map(l => `<td class="num">${p.lines[l] ? Math.round(p.lines[l]/p.w*100) : "·"}</td>`).join("")}
          <td class="${c.cls}">${c.txt}</td></tr>`; }).join("");
      })()}</tbody></table></div>` : `<div class="empty">No partnerships yet — they appear once matches are added.</div>`}
  </section>`;
  v.querySelectorAll("th[data-k]").forEach(h => h.onclick = () => { if (sortKey===h.dataset.k) sortDir*=-1; else { sortKey=h.dataset.k; sortDir = h.dataset.k==="wtnD"||h.dataset.k==="name" ? 1 : -1; } render(); });
  v.querySelectorAll(".inout").forEach(c => c.onchange = () => { playerById(team,c.dataset.id).out = !c.checked; save(current); render(); });
  v.querySelectorAll("input.rate").forEach(i => i.onchange = () => { playerById(team,i.dataset.id)[i.dataset.f] = num(i.value); save(current); render(); });
  v.querySelectorAll("input.pnote").forEach(i => i.onchange = () => { playerById(team,i.dataset.id).note = i.value.trim(); save(current); });
  v.querySelectorAll(".del").forEach(b => b.onclick = () => armConfirm(b, "Tap again to remove", () => {
    const id = b.dataset.id;
    team.players = team.players.filter(p => p.id !== id);
    team.matches.forEach(m => m.lines.forEach(l => l.players = (l.players||[]).filter(x => x !== id)));
    team.knownPairs = (team.knownPairs||[]).filter(p => !p.includes(id));
    save(current); render();
  }));
}

// two-tap confirm (dialogs are blocked in this frame)
function armConfirm(btn, label, fn){
  if (btn.dataset.armed){ fn(); return; }
  const old = btn.textContent; btn.dataset.armed = "1"; btn.textContent = label;
  setTimeout(() => { if (document.body.contains(btn)){ delete btn.dataset.armed; btn.textContent = old; } }, 3000);
}

function renderMatches(v, team){
  const ms = [...team.matches].sort((a,b) => (b.date||"").localeCompare(a.date||""));
  v.innerHTML = `<section class="panel"><h2>Match history</h2>
    ${ms.length ? ms.map(m => `<div class="match">
      <div><span class="pill ${m.stage}">${STAGES[m.stage]}</span> <b>${esc(m.date||"No date")}</b> vs ${esc(m.opponent||"—")}
        <div class="small muted">${m.lines.filter(l=>l.players?.length).map(l => `${l.line}: ${pairName(team,l.players)}${l.result?` (${l.result})`:""}`).join(" · ")}</div></div>
      <div class="row"><button class="btn ghost edit" data-id="${m.id}">Edit</button><button class="btn danger delm" data-id="${m.id}">Delete</button></div>
    </div>`).join("") : `<div class="empty">No matches yet. Add scorecards under “Add data”.</div>`}</section>`;
  v.querySelectorAll(".edit").forEach(b => b.onclick = () => {
    const m = JSON.parse(JSON.stringify(team.matches.find(m=>m.id===b.dataset.id)));
    draft = {...m, lines: LINES.map(l => m.lines.find(x=>x.line===l) || {line:l, players:[], result:""})};
    draft.names = draft.lines.map(l => (l.players||[]).map(i => nameOf(team,i)));
    tab="import"; render();
  });
  v.querySelectorAll(".delm").forEach(b => b.onclick = () => armConfirm(b, "Tap again to delete", () => { team.matches = team.matches.filter(m => m.id !== b.dataset.id); save(current); render(); }));
}

function newDraft(){ return {id:null, date:"", stage:"regular", opponent:"", lines: LINES.map(l=>({line:l, players:[], result:""})), names: LINES.map(()=>[])}; }

function renderImport(v, team){
  draft ||= newDraft();
  const names = team.players.map(p => p.name);
  v.innerHTML = `
  <section class="panel">
    <h2>Team details</h2>
    <div class="row"><label>TennisLink team name <input type="text" id="tname" value="${esc(team.teamName)}" placeholder="e.g. Club name 18 9.5 Combo"></label></div>
  </section>

  <section class="panel">
    <h2>Roster and ratings</h2>
    <p class="muted small">Paste one player per line: <code>Name, NTRP, WTN doubles, UTR doubles</code>. Missing ratings can be left blank. Existing players are updated, not duplicated.</p>
    <textarea id="rosterPaste" placeholder="Jordan Reyes, 5.0, 13.8, 10.4&#10;Sam Okafor, 4.5, , 9.6"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn" id="rosterSave">Update roster</button><span class="small muted" id="rosterMsg"></span></div>
  </section>

  <section class="panel editor">
    <h2>${draft.id ? "Edit match" : "Add a match"}</h2>
    ${sample ? `<p class="muted small">Paste a scorecard copied from TennisLink or TennisRecord and Claude will fill in the courts below for you to check. Or fill them in by hand.</p>
      <textarea id="scPaste" placeholder="Paste the full scorecard text here"></textarea>
      <div class="row" style="margin:8px 0 14px"><button class="btn ghost" id="parse">Fill in from scorecard</button><span class="small muted" id="parseMsg"></span></div>` : ""}
    <div class="row" style="margin-bottom:10px">
      <input type="date" id="mdate" value="${esc(draft.date)}" aria-label="Match date">
      <select id="mstage" aria-label="Stage">${Object.entries(STAGES).map(([k,l])=>`<option value="${k}" ${draft.stage===k?"selected":""}>${l}</option>`).join("")}</select>
      <input type="text" id="mopp" value="${esc(draft.opponent)}" placeholder="Opponent" aria-label="Opponent">
    </div>
    <datalist id="plist">${names.map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
    ${LINES.map((l,i) => `<div class="ed-line"><div class="ln">${l}</div>
      <input type="text" list="plist" data-i="${i}" data-j="0" value="${esc(draft.names[i][0]||"")}" placeholder="Player" aria-label="${l} player 1">
      <input type="text" list="plist" data-i="${i}" data-j="1" value="${esc(draft.names[i][1]||"")}" placeholder="Partner" aria-label="${l} player 2">
      <select class="res" data-i="${i}" aria-label="${l} result"><option value="">Result</option><option value="W" ${draft.lines[i].result==="W"?"selected":""}>Won</option><option value="L" ${draft.lines[i].result==="L"?"selected":""}>Lost</option></select>
    </div>`).join("")}
    <div class="row" style="margin-top:10px"><button class="btn" id="msave">${draft.id ? "Save changes" : "Save match"}</button><button class="btn ghost" id="mclear">Clear</button><span class="small muted" id="mMsg"></span></div>
  </section>`;

  v.querySelector("#tname").onchange = e => { team.teamName = e.target.value.trim(); save(current); };
  v.querySelector("#rosterSave").onclick = () => {
    let n = 0;
    v.querySelector("#rosterPaste").value.split(/\n/).forEach(line => {
      const c = line.split(/[,\t]/).map(s => s.trim()); if (!c[0]) return;
      const id = ensurePlayer(team, c[0]), p = playerById(team,id);
      [["ntrp",1],["wtnD",2],["utrD",3]].forEach(([f,i]) => { if (num(c[i]) != null) p[f] = num(c[i]); });
      n++;
    });
    save(current); v.querySelector("#rosterMsg").textContent = `Updated ${n} player${n===1?"":"s"}.`;
  };
  const syncDraft = () => {
    draft.date = v.querySelector("#mdate").value; draft.stage = v.querySelector("#mstage").value; draft.opponent = v.querySelector("#mopp").value.trim();
    v.querySelectorAll(".ed-line input").forEach(inp => { draft.names[+inp.dataset.i][+inp.dataset.j] = inp.value.trim(); });
    v.querySelectorAll(".ed-line select.res").forEach(s => { draft.lines[+s.dataset.i].result = s.value; });
  };
  v.querySelectorAll("#mdate,#mstage,#mopp,.ed-line input,.ed-line select").forEach(el => el.onchange = syncDraft);
  v.querySelector("#mclear").onclick = () => { draft = newDraft(); render(); };
  v.querySelector("#msave").onclick = () => {
    syncDraft();
    if (!draft.names.some(n => n.some(Boolean))){ v.querySelector("#mMsg").textContent = "Add at least one player before saving."; return; }
    const m = {id: draft.id || ("m"+Date.now().toString(36)), date:draft.date, stage:draft.stage, opponent:draft.opponent,
      lines: LINES.map((l,i) => ({line:l, players: draft.names[i].filter(Boolean).map(n => ensurePlayer(team,n)), result: draft.lines[i].result}))};
    const idx = team.matches.findIndex(x => x.id === m.id);
    if (idx >= 0) team.matches[idx] = m; else team.matches.push(m);
    save(current); draft = newDraft(); tab = "matches"; render();
  };
  const parseBtn = v.querySelector("#parse");
  if (parseBtn) parseBtn.onclick = async () => {
    const raw = v.querySelector("#scPaste").value.trim(), msg = v.querySelector("#parseMsg");
    if (!raw){ msg.textContent = "Paste a scorecard first."; return; }
    parseBtn.disabled = true; msg.textContent = "Reading the scorecard…";
    try {
      const out = await sample.json(
`You extract USTA League 9.5 Combo Doubles team match scorecards into JSON. Combo matches have three doubles courts (D1, D2, D3). The team we care about is "${team.teamName || teamLabel(current)}". Known players on that team: ${names.join("; ") || "unknown"}.
Return ONLY JSON: {"date":"YYYY-MM-DD or empty","stage":"regular|playoff|sectional","opponent":"other team's name","lines":[{"line":"D1|D2|D3","players":["full names of OUR team's two players only"],"result":"W|L|"}]}.
Use "result" from our team's perspective. Match player names to the known list when they are clearly the same person. If stage is unclear, use "regular". Include only lines that appear.

Scorecard:
${raw.slice(0, 12000)}`, {modelTier:"default"});
      draft.date = out.date || draft.date; draft.stage = STAGES[out.stage] ? out.stage : draft.stage; draft.opponent = out.opponent || draft.opponent;
      (out.lines||[]).forEach(ln => { const i = LINES.indexOf(ln.line); if (i<0) return; draft.names[i] = (ln.players||[]).slice(0,2); draft.lines[i].result = ln.result === "W" || ln.result === "L" ? ln.result : ""; });
      render(); const m2 = document.getElementById("parseMsg"); if (m2) m2.textContent = "Filled in — check the courts, then save.";
    } catch(e){
      msg.textContent = e.code === "not_granted" ? "Scorecard reading wasn't allowed — fill the courts in by hand." : e.code === "rate_limited" ? "Too many requests — wait a moment and try again." : "Couldn't read that scorecard — fill the courts in by hand.";
    } finally { if (document.body.contains(parseBtn)) parseBtn.disabled = false; }
  };
}

function emptyState(team){
  return `<section class="panel empty"><h2>No match history for ${esc(teamLabel(current))} yet</h2>
    <p>Add their season and local-playoff scorecards and the projected lineup appears here.</p>
    <button class="btn" id="goImport">Add data</button></section>`;
}
function bindEmpty(v){ const b = v.querySelector("#goImport"); if (b) b.onclick = () => { tab="import"; render(); }; }

render();
</script>
</body>
</html>
